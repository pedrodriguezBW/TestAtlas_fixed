spring.application.name=test-atlas
# Optional local configuration: a .env file (KEY=value) in the working directory
# or its parent is read as extra properties. Real environment variables win.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

server.port=${SERVER_PORT:17000}
server.address=${SERVER_ADDRESS:127.0.0.1}
# Saving a test can move several GB of files: keep the long NDJSON stream open.
spring.mvc.async.request-timeout=30m

# Test Atlas project repository: \\vigvsfil1.global.borgwarner.net\vigproductengineering\Documentacion_I+D\R&T\9. CL
# (written with / so the value needs no escaping). TESTATLAS_REPOSITORY_ROOT overrides it, e.g. with a local folder.
testatlas.repository-root=${TESTATLAS_REPOSITORY_ROOT://vigvsfil1.global.borgwarner.net/vigproductengineering/Documentacion_I+D/R&T/9. CL}
# Vibration tests are saved in their own repository: \\vigvsfil1.global.borgwarner.net\vigproductengineering\Documentacion_I+D\R&T\7. Vib
# TESTATLAS_VIBRATION_REPOSITORY_ROOT overrides it, e.g. with a local folder.
testatlas.vibration-repository-root=${TESTATLAS_VIBRATION_REPOSITORY_ROOT://vigvsfil1.global.borgwarner.net/vigproductengineering/Documentacion_I+D/R&T/7. Vib}
# Temporary folder for uploads before the save (default: <java.io.tmpdir>/test-atlas-staging).
testatlas.staging-root=${TESTATLAS_STAGING_ROOT:${java.io.tmpdir}/test-atlas-staging}
# Browser origins allowed to call the API directly (comma-separated).
testatlas.frontend-origins=${TESTATLAS_FRONTEND_ORIGINS:http://localhost:18000,http://127.0.0.1:18000}
